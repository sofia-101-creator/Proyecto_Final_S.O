worker_processes auto;
events { worker_connections 1024; }
http {
    log_format lb '$remote_addr upstream=$upstream_addr "$request" status=$status tiempo=$request_time';
    access_log /dev/stdout lb;
    error_log /dev/stderr warn;
    upstream backend_pool {
        zone backend_pool 64k;
        server app1:5000;
        server app2:5000;
        server app3:5000;
    }
    server {
        listen 80;
        server_name _;
        location = /nginx-health { access_log off; return 200 "ok\n"; }
        location = /metrics { return 404; }
        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            add_header X-Upstream $upstream_addr always;
        }
    }
    server {
        listen 8081;
        location = /stub_status { stub_status; access_log off; }
        location / { return 404; }
    }
}
