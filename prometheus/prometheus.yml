global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: backend
    static_configs:
      - targets: ['app1:5000', 'app2:5000', 'app3:5000']
  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
